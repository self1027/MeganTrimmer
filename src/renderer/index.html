<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: file:;">
  <title>NoBSTrimmer</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-wrapper">
    <!-- ========== LEFT EDITOR ========== -->
    <div class="left-editor">
      <div class="top-bar">
        <button id="select">ABRIR ARQUIVO</button>
      </div>

      <div class="video-player">
        <video id="preview"></video>
      </div>

      <div class="playback-info">
        <div class="controls-group">
          <button class="control-btn" id="play" title="Play">▶️</button>
          <button class="control-btn" id="pause" title="Pause">⏸️</button>
          <button class="control-btn" id="muteBtn" title="Mute/Unmute">🔊</button>
          <input type="range" id="volume" class="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
      </div>

      <div class="trim-meta">
        <div>INÍCIO: <strong id="startDisplay">00:00:00</strong></div>
        <div>DURAÇÃO: <strong id="selectedDuration">0.0S</strong></div>
        <div>FIM: <strong id="endDisplay">00:00:00</strong></div>
      </div>

      <div class="timeline-container" id="timeline">
        <div class="storyboard-wrapper">
          <div id="framesContainer" class="frames"></div>
        </div>
        <div class="timeline-track-bg"></div>
        <div class="timeline-mask left"></div>
        <div class="timeline-mask right"></div>
        <div class="timeline-range-highlight"></div>
        <div id="playheadLine" class="timeline-playhead"></div>
        <input type="range" id="startRange" class="timeline-input start-handle">
        <input type="range" id="endRange" class="timeline-input end-handle">
        <input type="range" id="playhead" class="timeline-input playhead-handle">
        <div class="scissor start-scissor">✂</div>
        <div class="scissor end-scissor">✂</div>
      </div>
    </div>

    <!-- ========== RIGHT SIDEBAR ========== -->
    <div class="right-sidebar">
      <div class="dropdown-group">
        <label for="formatSelect">Formato</label>
        <select id="formatSelect" class="styled-dropdown"></select>

        <label for="resolutionSelect">Resolução</label>
        <select id="resolutionSelect" class="styled-dropdown"></select>

        <label for="frameRateSelect">Frame Rate</label>
        <select id="frameRateSelect" class="styled-dropdown"></select>
      </div>

      <button id="btn" class="btn-orange save-btn">EXPORTAR CORTE</button>

      <div class="footer">
        <p>DESENVOLVIDO POR <strong>MURILO D.</strong></p>
        <div class="social-links">
          <a href="https://murilod.dev/" target="_blank">PORTFÓLIO</a>
          <a href="https://www.linkedin.com/in/murilo-dias-dev/" target="_blank">LINKEDIN</a>
          <a href="https://github.com/self1027" target="_blank">GITHUB</a>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./renderer.js"></script>
</body>
</html>
