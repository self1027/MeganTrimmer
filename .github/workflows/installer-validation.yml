name: Native installer validation

on:
  push:
    branches: [codex/reliable-export-polish]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npm run dist
      - run: node scripts/build-next.cjs
      - name: Validate real installation, migration, replacement and portable behavior
        shell: pwsh
        run: ./scripts/installer-smoke.ps1
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: native-installer-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            .cache/native-validation/*.json
            .cache/native-validation/*.log
